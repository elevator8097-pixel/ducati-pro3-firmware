name: Build Firmware
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make wget unzip
      - name: Download GD32F10x Library
        run: |
         wget https://github.com/CommunityGD32Cores/GD32F10x_Firmware_Library/archive/refs/heads/master.zip
          unzip master.zip
          mkdir -p lib
          mv GD32F10x_Firmware_Library-master lib/GD32F10x_standard_peripheral
      - name: Build
        run: make
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ducati_pro3_firmware
          path: ducati_pro3.bin
